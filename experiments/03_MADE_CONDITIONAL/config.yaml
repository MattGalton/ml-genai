defaults:
  - /train/default@_global_
  - override /model: made_conditional
  - override /optimizer: adam
  - override /dataset: bmnist
  - _self_

model:
  target:
    layer_sizes: [784, 2048, 2048, 784]
    mask_update_frequency: 10
optimizer:
  lr: 0.001
trainer:
  max_epochs: 29
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: checkpoints
      filename: "model-{epoch:02d}-{val_loss:.2f}"
      monitor: val_loss
      mode: min
      save_top_k: 3
      save_last: true
      every_n_epochs: 1
    - _target_: mattg.training.callbacks.ReportingCallback
      dir: .
    - _target_: mattg.training.callbacks.SamplingCallback
      sampler:
        _target_: mattg.sampling.AncestralSampler
      sample_every_n_epochs: 1
      output_dir: samples
      num_samples: 80
      samples_per_label: 8
