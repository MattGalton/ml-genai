trainer:
  _target_: lightning.Trainer
  precision: 32
  benchmark: true
  max_epochs: 10
  accelerator: mps
  log_every_n_steps: 2
  enable_progress_bar: true
  enable_model_summary: true
  enable_checkpointing: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: checkpoints
      filename: "model-{epoch:02d}-{val_loss:.2f}"
      monitor: val_loss
      mode: min
      save_top_k: 3
      save_last: true
      every_n_epochs: 1
    # - _target_: mattg.training.callbacks.FIDCallback
    # - _target_: mattg.training.callbacks.InceptionScoreCallback
    - _target_: mattg.training.callbacks.ReportingCallback
      dir: .