[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-genai"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "hydra-core>=1.3.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.1",
    "lightning>=2.6.5",
    "matplotlib>=3.11.0",
    "omegaconf>=2.3.1",
    "pre-commit",
    "pydantic>=2.13.4",
    "pytest",
    "pytorch-lightning>=2.6.5",
    "ruff",
    "torch>=2.12.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.1",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["mattg*", "hydra_plugins*"]
namespaces = true
